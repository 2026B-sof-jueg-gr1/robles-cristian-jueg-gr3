<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada — Operación Supervivencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Portada 630 × 500 para itch.io. Se exporta a PNG con press/render-cover.js */
  html,body{margin:0;padding:0;background:#000}
  .cover{
    position:relative;width:630px;height:500px;overflow:hidden;
    background:#0e140f;
    font-family:'Share Tech Mono',monospace;
  }
  svg.scene{position:absolute;inset:0;width:630px;height:500px}

  /* Panel de texto: scrim que garantiza legibilidad del titular */
  .scrim{
    position:absolute;inset:0;z-index:2;
    background:linear-gradient(100deg,#0a0e0b 0%,#0a0e0b 34%,rgba(10,14,11,.94) 44%,rgba(10,14,11,.55) 58%,rgba(10,14,11,0) 74%);
  }
  .scan{
    position:absolute;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);
    opacity:.55;
  }
  .vig{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at 62% 48%,transparent 42%,rgba(0,0,0,.78) 100%);
  }
  .watermark{
    position:absolute;left:132px;bottom:-52px;z-index:3;
    font-family:'VT323',monospace;font-size:300px;line-height:.8;
    color:rgba(196,209,155,.06);letter-spacing:-.03em;
    pointer-events:none;user-select:none;
  }

  .txt{position:absolute;left:36px;top:44px;z-index:6}
  .kicker{
    font-size:9.5px;letter-spacing:.36em;color:#b8503c;margin-bottom:16px;
    text-transform:uppercase;
  }
  h1{
    font-family:'VT323',monospace;font-weight:400;
    font-size:58px;line-height:.84;letter-spacing:.005em;margin:0;
    color:#f2f5ec;
    text-shadow:0 0 38px rgba(196,209,155,.4),0 3px 0 rgba(0,0,0,.85);
  }
  h1 span{display:block}
  h1 .g{color:#c4d19b}
  .rule{width:46px;height:2px;background:#b8503c;margin:20px 0 13px}
  .sub{font-size:9px;letter-spacing:.3em;color:#8d9c83;text-transform:uppercase;line-height:2}

  .bottom{
    position:absolute;left:36px;right:36px;bottom:26px;z-index:6;
    display:flex;justify-content:space-between;align-items:flex-end;
    border-top:1px solid rgba(196,209,155,.24);padding-top:13px;
  }
  .tag{font-size:10.5px;letter-spacing:.2em;color:#d5dfcc;text-transform:uppercase}
  .tag b{color:#ffe3a0;font-weight:400}
  .tech{font-size:8.5px;letter-spacing:.2em;color:#6f7e67;text-transform:uppercase;text-align:right;line-height:1.8}
  .hazard{
    position:absolute;left:0;right:0;top:0;height:6px;z-index:7;
    background:repeating-linear-gradient(45deg,rgba(227,93,50,.8) 0 9px,transparent 9px 18px);
  }
</style>
</head>
<body>
<div class="cover">

  <svg class="scene" viewBox="0 0 630 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="floor" cx="62%" cy="50%" r="62%">
        <stop offset="0" stop-color="#2f3a2c"/>
        <stop offset="55%" stop-color="#1e2721"/>
        <stop offset="100%" stop-color="#0d1310"/>
      </radialGradient>
      <radialGradient id="flash" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff8e0" stop-opacity=".95"/>
        <stop offset="45%" stop-color="#ffc98a" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#e35d32" stop-opacity="0"/>
      </radialGradient>

      <!-- Zombi en silueta: la horda se lee como amenaza, no como personajes -->
      <g id="z">
        <ellipse cx="1" cy="5" rx="16" ry="12" fill="#000" opacity=".45"/>
        <rect x="-15" y="-3" width="7" height="16" rx="3" fill="#33402e"/>
        <rect x="8" y="-3" width="7" height="16" rx="3" fill="#33402e"/>
        <rect x="-9" y="-2" width="18" height="17" rx="4" fill="#2b3727"/>
        <rect x="-8" y="11" width="6" height="7" fill="#232c20"/>
        <rect x="3" y="11" width="6" height="7" fill="#232c20"/>
        <circle cx="0" cy="-9" r="9" fill="#3a4834"/>
        <circle cx="-3" cy="-10" r="1.9" fill="#c4d19b" opacity=".8"/>
        <circle cx="4" cy="-10" r="1.9" fill="#c4d19b" opacity=".8"/>
      </g>

      <!-- Soldado visto desde arriba, mirando a la izquierda -->
      <g id="hero">
        <ellipse cx="3" cy="13" rx="22" ry="14" fill="#000" opacity=".45"/>
        <rect x="9" y="-8" width="8" height="18" rx="3" fill="#4a5539"/>
        <rect x="-11" y="-11" width="24" height="23" rx="7" fill="#7c8b5a"/>
        <rect x="-11" y="-11" width="24" height="8" rx="5" fill="#8d9c6a"/>
        <rect x="-21" y="-9" width="15" height="6.5" rx="3" fill="#6b7a4f"/>
        <rect x="-21" y="2" width="15" height="6.5" rx="3" fill="#6b7a4f"/>
        <rect x="-39" y="-2.2" width="32" height="5.4" fill="#4d5347"/>
        <rect x="-39" y="-2.2" width="32" height="1.8" fill="#727966"/>
        <rect x="-45" y="-3.2" width="7.5" height="7.4" rx="1" fill="#2b3029"/>
        <rect x="-25" y="-3.6" width="6.5" height="9" rx="2.5" fill="#b8b58b"/>
        <circle cx="-2" cy="-5" r="9" fill="#46523c"/>
        <path d="M-11 -5 a9 9 0 0 1 7.1 -8.7" fill="none" stroke="#b8b58b" stroke-width="1.7" opacity=".95"/>
        <circle cx="-2" cy="-5" r="4.9" fill="#b8b58b"/>
        <circle cx="-3.3" cy="-5.4" r="2.1" fill="#5d6b48"/>
      </g>
    </defs>

    <!-- suelo -->
    <rect width="630" height="500" fill="url(#floor)"/>

    <!-- textura de asfalto -->
    <g fill="#3a4038" opacity=".45">
      <circle cx="500" cy="80" r="3"/><circle cx="560" cy="150" r="4"/><circle cx="430" cy="60" r="2"/>
      <circle cx="600" cy="300" r="5"/><circle cx="520" cy="420" r="4"/><circle cx="390" cy="460" r="3"/>
      <circle cx="470" cy="180" r="2"/><circle cx="610" cy="220" r="3"/><circle cx="350" cy="90" r="3"/>
    </g>

    <!-- calzada y línea desgastada -->
    <path d="M470 0 L630 0 L630 500 L560 500 Z" fill="#3a3e3c" opacity=".5"/>
    <g fill="#b0a77d" opacity=".28">
      <rect x="574" y="40" width="5" height="30" transform="rotate(6 576 55)"/>
      <rect x="583" y="140" width="5" height="30" transform="rotate(6 585 155)"/>
      <rect x="592" y="240" width="5" height="30" transform="rotate(6 594 255)"/>
      <rect x="601" y="340" width="5" height="30" transform="rotate(6 603 355)"/>
      <rect x="610" y="440" width="5" height="30" transform="rotate(6 612 455)"/>
    </g>

    <!-- grietas -->
    <g stroke="#121714" stroke-width="2.2" opacity=".85" fill="none" stroke-linecap="round">
      <path d="M520 40 L540 74 L522 100"/>
      <path d="M430 200 L452 232 L436 260"/>
      <path d="M596 200 L616 232"/>
      <path d="M470 400 L492 430 L476 458"/>
      <path d="M560 120 L580 150 L566 176"/>
    </g>

    <!-- radar / retícula táctica -->
    <g fill="none" stroke="#c4d19b" opacity=".22">
      <circle cx="470" cy="266" r="58" stroke-width="1" stroke-dasharray="3 7"/>
      <circle cx="470" cy="266" r="104" stroke-width="1"/>
      <circle cx="470" cy="266" r="158" stroke-width="1" opacity=".55"/>
      <path d="M470 96 v-16 M470 436 v16 M300 266 h-16 M640 266 h16" stroke-width="1.4"/>
    </g>
    <g fill="#c4d19b" opacity=".5">
      <circle cx="470" cy="266" r="2.4"/>
    </g>

    <!-- horda convergiendo -->
    <use href="#z" transform="translate(404 140) rotate(118) scale(1.45)"/>
    <use href="#z" transform="translate(356 300) rotate(96) scale(1.75)"/>
    <use href="#z" transform="translate(416 420) rotate(58) scale(1.5)"/>
    <use href="#z" transform="translate(338 200) rotate(126) scale(1.2)"/>
    <use href="#z" transform="translate(556 392) rotate(-38) scale(1.15)" opacity=".6"/>

    <!-- soldado -->
    <use href="#hero" transform="translate(482 262) rotate(0) scale(2.6)"/>

    <!-- fogonazo en la boca del rifle -->
    <g transform="translate(362 255)">
      <circle r="30" fill="url(#flash)"/>
      <path d="M0 -9 L-27 0 L0 9 Z" fill="#ffe3a0" opacity=".92"/>
      <path d="M0 -4 L-14 0 L0 4 Z" fill="#fffdf2" opacity=".95"/>
      <circle r="4" fill="#fffdf2"/>
    </g>

    <!-- brasas -->
    <g transform="translate(616 60)">
      <circle r="20" fill="#e35d32" opacity=".1"/>
      <path d="M0 -12 L5 4 L-5 4 Z" fill="#ffa34a" opacity=".6"/>
    </g>
  </svg>

  <div class="scrim"></div>
  <div class="watermark" aria-hidden="true">04</div>
  <div class="vig"></div>
  <div class="scan"></div>
  <div class="hazard"></div>

  <div class="txt">
    <div class="kicker">Unidad de contención · Sector 04</div>
    <h1><span>Operación</span><span class="g">Supervivencia</span></h1>
    <div class="rule"></div>
    <div class="sub">Última esperanza<br>Una ciudad por delante</div>
  </div>

  <div class="bottom">
    <div class="tag">Vuelve a casa. <b>O inténtalo otra vez.</b></div>
    <div class="tech">HTML5 · Phaser 3<br>Juega en el navegador</div>
  </div>
</div>
</body>
</html>
